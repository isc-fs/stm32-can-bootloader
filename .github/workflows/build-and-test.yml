name: Build & test

# Runs on every push and PR. Two parallel jobs:
#
#   1. firmware-build — cross-compile the BL with arm-none-eabi-gcc
#      for both Debug and Release. Catches warnings, link errors, and
#      memory-budget regressions on the firmware target.
#
#   2. host-tests — build + run the Unity-based host unit tests under
#      tests/unit/. Catches logic regressions in the pure-logic modules
#      (bl_isotp, bl_fwinfo, bl_nvm, …) and the just-fixed NVM
#      compact-replace / format paths.
#
# Both jobs use a Linux runner, pinned tool versions, and FetchContent
# for Unity so there's no submodule maintenance.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel stale runs on the same ref so a quick push doesn't queue
# behind a slower in-flight build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    name: Firmware build (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }}

      - name: Report flash usage
        run: |
          ELF=build/${{ matrix.preset }}/CAN_BL.elf
          arm-none-eabi-size --format=berkeley "$ELF"

      - name: Upload .elf / .bin / .hex artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CAN_BL-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/CAN_BL.elf
            build/${{ matrix.preset }}/CAN_BL.bin
            build/${{ matrix.preset }}/CAN_BL.hex
          if-no-files-found: warn
          retention-days: 14

  host-tests:
    name: Host unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure
        run: cmake -B build-tests -S tests/unit -G Ninja

      - name: Build
        run: cmake --build build-tests

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  host-tests-sanitized:
    # Same suite, but compiled with AddressSanitizer + UndefinedBehaviorSanitizer.
    # Catches memory issues (heap/stack OOB, use-after-free) and signed
    # integer overflow / shift-out-of-range / null deref etc. that the
    # plain debug build doesn't flag.
    #
    # -fno-sanitize-recover=all turns every detected issue into an
    # immediate abort, so the test failure surfaces as a non-zero exit
    # code instead of a buried warning on stderr.
    #
    # Runs in parallel with `host-tests`. Not (yet) added to branch-
    # protection required checks — promote to required after a few
    # successful runs to make sure the sanitizers stay green under
    # normal development.
    name: Host unit tests (ASan + UBSan)
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure
        run: |
          cmake -B build-tests-san -S tests/unit -G Ninja \
            -DCMAKE_C_FLAGS_INIT='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g -O1' \
            -DCMAKE_EXE_LINKER_FLAGS_INIT='-fsanitize=address,undefined'

      - name: Build
        run: cmake --build build-tests-san

      - name: Run tests
        # ASAN_OPTIONS / UBSAN_OPTIONS keep the runtime verbose and
        # ensure no detection is silently downgraded. abort_on_error
        # makes CI failures point at the exact crash, not a continuing
        # run.
        env:
          ASAN_OPTIONS:  detect_leaks=1:abort_on_error=1:strict_string_checks=1:check_initialization_order=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-tests-san --output-on-failure

  host-coverage:
    # Re-builds the Unity suite with --coverage instrumentation, runs
    # the tests, and reports per-file line coverage on the bl_*.c
    # modules. Fails if total line coverage drops below the floor.
    #
    # Floor is the observed baseline minus a small buffer:
    #   bl_fwinfo.c    100%
    #   bl_isotp.c      93%
    #   bl_nvm.c        82%
    #   bl_log.c        38%
    #   bl_proto.c      15%  (dispatch + serial paths need HAL)
    #   TOTAL          ~43%
    # So 40 is the "don't backslide" floor for the first landing.
    # Once we add tests for bl_proto / bl_log we ratchet this up, and
    # eventually move to per-file thresholds so bl_proto can't keep
    # pulling the total down.
    #
    # The HTML report is uploaded as an artifact so devs can download
    # it and look at the un-covered lines visually.
    name: Host coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps + gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential lcov
          pip install --user gcovr==7.2

      - name: Configure with --coverage
        run: |
          cmake -B build-tests-cov -S tests/unit -G Ninja \
            -DCMAKE_C_FLAGS_INIT='--coverage -O0 -g' \
            -DCMAKE_EXE_LINKER_FLAGS_INIT='--coverage'

      - name: Build
        run: cmake --build build-tests-cov

      - name: Run tests
        run: ctest --test-dir build-tests-cov --output-on-failure

      - name: Generate coverage report
        # Filter to Core/Src/bl_*.c only — we care about BL module
        # coverage, not the test files or Unity itself.
        run: |
          gcovr --root . \
            --filter 'Core/Src/bl_' \
            --print-summary \
            --txt /tmp/coverage.txt \
            --html-details /tmp/coverage.html \
            --json-summary /tmp/coverage.json \
            build-tests-cov
          echo
          echo '=== per-file (txt) ==='
          cat /tmp/coverage.txt

      - name: Enforce floor (40% total line coverage on Core/Src/bl_*.c)
        # 40% is the "don't backslide" floor — observed baseline is
        # ~43% so this gives a small buffer. Ratchet up as we add
        # tests for bl_proto / bl_log; consider per-file thresholds
        # so the giant bl_proto.c can't keep pulling the total down.
        run: |
          gcovr --root . \
            --filter 'Core/Src/bl_' \
            --fail-under-line 40 \
            build-tests-cov

      - name: Write step summary
        run: |
          {
            echo "## Host coverage summary"
            echo ''
            echo '```'
            cat /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: /tmp/coverage.html*
          retention-days: 14

  clang-tidy:
    # Runs clang-tidy only on lines this PR touched (via the upstream
    # clang-tidy-diff.py helper). That keeps the gate adoptable without a
    # big-bang cleanup PR for pre-existing warnings — only *new* issues
    # introduced by the diff fail the build.
    #
    # We re-use the host-tests CMake project to generate
    # compile_commands.json. It's the only CMake target that compiles
    # the bl_*.c modules on a host with stubs, so its database has the
    # right -I/-D for clang-tidy to parse them. Firmware-only TUs
    # (main.c, stm32h7xx_hal_msp.c) are out of scope for now;
    # cross-compiling them through clang-tidy is a follow-up.
    #
    # Why PR-only (`if:` below): the diff is computed against
    # `github.base_ref`, which is only defined for pull_request events.
    # On push events the BL doesn't have a stable "base" — the gate just
    # skips.
    name: clang-tidy (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Need enough history to compute the diff against the base
          # branch. `fetch-depth: 0` pulls the full history; cheap on a
          # small repo and avoids surprise shallow-clone issues.
          fetch-depth: 0

      - name: Install clang-tidy + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-15 cmake ninja-build build-essential
          # Expose a stable `clang-tidy` name so clang-tidy-diff.py picks
          # up the right binary without having to pass -clang-tidy-binary
          # everywhere.
          sudo update-alternatives --install \
            /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-15 100

      - name: Configure tests with compile_commands.json
        run: |
          cmake -B build-tests -S tests/unit -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (so generated headers exist for the AST)
        run: cmake --build build-tests

      - name: Run clang-tidy on diff vs ${{ github.base_ref }}
        # clang-tidy-diff.py (shipped with clang-tools-15) reads a unified
        # diff on stdin and only runs clang-tidy on lines the diff
        # touched, so PRs aren't blocked by pre-existing tech debt.
        #
        # Scope: only files that ACTUALLY have entries in the host-tests
        # `compile_commands.json` are passed to git-diff. Firmware-only
        # TUs (`main.c`, `bl_health.c`, etc.) can't be parsed by host
        # clang because of HAL macro / header dependencies; including
        # them would surface "use of undeclared identifier RCC_RSR_*"
        # parser errors that have nothing to do with the PR. We derive
        # the file list at runtime from the compile DB so this stays in
        # sync as host-tests grows.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          BASE_SHA=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          echo "Diffing against $BASE_SHA (origin/${{ github.base_ref }})"

          # clang-tidy-diff.py lives in one of two places depending on the
          # apt package layout; probe both.
          DIFF_SCRIPT=/usr/share/clang/clang-tidy-diff.py
          if [ ! -x "$DIFF_SCRIPT" ]; then
            DIFF_SCRIPT=/usr/lib/llvm-15/share/clang/clang-tidy-diff.py
          fi
          if [ ! -x "$DIFF_SCRIPT" ]; then
            echo "Could not find clang-tidy-diff.py" >&2
            exit 1
          fi
          echo "Using $DIFF_SCRIPT"

          # Derive the in-DB file list. `compile_commands.json` stores
          # absolute paths; strip the workspace prefix to get the same
          # relative form `git diff` produces, then keep only the BL
          # sources (drop the Unity / mocks TUs — clang-tidy them is
          # noise). Headers are included via the matching `bl_*.h`
          # glob; they're not in the DB themselves but get pulled in
          # transitively when a TU includes them.
          mapfile -t CT_SOURCES < <(
            jq -r '.[].file' build-tests/compile_commands.json \
              | sed "s|^$GITHUB_WORKSPACE/||" \
              | grep -E '^Core/Src/bl_.*\.c$' \
              | sort -u
          )
          CT_PATHS=("${CT_SOURCES[@]}" 'Core/Inc/bl_*.h')
          echo "Tidy scope (${#CT_PATHS[@]} entries):"
          printf '  %s\n' "${CT_PATHS[@]}"

          # -p1 strips the a/ b/ prefix that `git diff` prepends.
          # -path build-tests points clang-tidy at our compile_commands.
          # -regex limits which file types the script will scan.
          git diff -U0 "$BASE_SHA" HEAD -- "${CT_PATHS[@]}" \
            | "$DIFF_SCRIPT" -p1 -path build-tests -regex '.*\.(c|h)' \
            | tee tidy-output.txt

          # Only count *check findings* — those carry a `[check-name]`
          # tag at the end of the line. Raw parser errors don't (and
          # shouldn't be possible since we just filtered the diff to
          # files in the compile DB, but defence in depth).
          # WarningsAsErrors: '*' in .clang-tidy makes each finding
          # print as `error: … [check-name]`, so the regex catches
          # both warning and error severities.
          if grep -E '(warning|error):.*\[[^]]+\]' tidy-output.txt > /dev/null; then
            echo "::error::clang-tidy reported issues on changed lines — see log above"
            exit 1
          fi
          echo "clang-tidy: no issues on changed lines"

  firmware-size:
    # Builds the Release preset twice — once on this PR's head and once
    # on the base branch — and fails if any segment grew by more than
    # the per-segment threshold below. Goal: catch accidental flash/RAM
    # bloat early. The link itself already catches "doesn't fit"; this
    # job catches "fits, but is a lot bigger than last week" trends.
    #
    # Why PR-only (`if:` below): the gate needs a "before" to diff
    # against. On push events there's no PR base, so the job skips.
    # The push branch will still get a green Firmware build (Debug/
    # Release) job that reports absolute sizes via `arm-none-eabi-size`,
    # which is enough for direct-push observability.
    #
    # Thresholds (per segment, in bytes) live in the script step below.
    # They're tuned to "this PR meaningfully grew the firmware — is
    # that intentional?" rather than "we have arbitrary headroom".
    # Observed legitimate deltas across releases (each = a single
    # feature PR that didn't bloat the binary):
    #   v1.3.0 / PR #112 (NVM node-id override)  text +140 / data +4 / bss +4
    # Anything above the thresholds below is in genuinely-large-change
    # territory and wants a reviewer eye on it.
    name: Firmware size delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Need history to checkout the base branch via worktree.
          fetch-depth: 0

      - name: Install arm-none-eabi toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Release on PR head
        run: |
          cmake --preset Release
          cmake --build build/Release

      - name: Build Release on base (${{ github.base_ref }})
        # We use a worktree rather than `git checkout` so we don't lose
        # the head's build/ tree (which we still need for the diff
        # step). The worktree gets its own build/Release/.
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          git worktree add ../base-tree "origin/${{ github.base_ref }}"
          (cd ../base-tree && cmake --preset Release && cmake --build build/Release)

      - name: Compare segment sizes
        # `arm-none-eabi-size --format=berkeley` prints a 2-line table:
        #     text  data  bss  dec  hex  filename
        #     <N>   <N>   <N>  <N>  <h>  CAN_BL.elf
        # We parse line 2 into shell vars for head + base, diff them,
        # and write a summary table to $GITHUB_STEP_SUMMARY so the PR
        # reviewer sees the deltas at a glance.
        run: |
          set -euo pipefail

          # Tunable per-segment regression thresholds, in bytes.
          # Tightened from the v1.2.0 first-landing values
          # (2048 / 256 / 256) after observing several release cycles
          # of legitimate change deltas — see the header comment for
          # the numbers. text 1024 is still ~4 % of the current image;
          # data 64 catches any meaningful new global; bss 128 catches
          # surprise framework / RTOS allocations.
          TEXT_MAX_INCREASE=1024
          DATA_MAX_INCREASE=64
          BSS_MAX_INCREASE=128

          parse_size() {
            arm-none-eabi-size --format=berkeley "$1" \
              | awk 'NR==2 { print $1, $2, $3, $4 }'
          }

          HEAD_ELF="$GITHUB_WORKSPACE/build/Release/CAN_BL.elf"
          BASE_ELF="$GITHUB_WORKSPACE/../base-tree/build/Release/CAN_BL.elf"

          read TEXT_HEAD DATA_HEAD BSS_HEAD DEC_HEAD < <(parse_size "$HEAD_ELF")
          read TEXT_BASE DATA_BASE BSS_BASE DEC_BASE < <(parse_size "$BASE_ELF")

          TEXT_DELTA=$((TEXT_HEAD - TEXT_BASE))
          DATA_DELTA=$((DATA_HEAD - DATA_BASE))
          BSS_DELTA=$((BSS_HEAD  - BSS_BASE))
          DEC_DELTA=$((DEC_HEAD  - DEC_BASE))

          printf 'Segment   |   base   |   head   |   delta\n'
          printf 'text      | %8d | %8d | %+8d\n' "$TEXT_BASE" "$TEXT_HEAD" "$TEXT_DELTA"
          printf 'data      | %8d | %8d | %+8d\n' "$DATA_BASE" "$DATA_HEAD" "$DATA_DELTA"
          printf 'bss       | %8d | %8d | %+8d\n' "$BSS_BASE"  "$BSS_HEAD"  "$BSS_DELTA"
          printf 'dec total | %8d | %8d | %+8d\n' "$DEC_BASE"  "$DEC_HEAD"  "$DEC_DELTA"

          {
            echo "## Firmware size delta (Release)"
            echo ""
            echo "| Segment | base (${{ github.base_ref }}) | head (this PR) | delta |"
            echo "|---|---:|---:|---:|"
            printf '| text | %d | %d | %+d |\n'  "$TEXT_BASE" "$TEXT_HEAD" "$TEXT_DELTA"
            printf '| data | %d | %d | %+d |\n'  "$DATA_BASE" "$DATA_HEAD" "$DATA_DELTA"
            printf '| bss  | %d | %d | %+d |\n'  "$BSS_BASE"  "$BSS_HEAD"  "$BSS_DELTA"
            printf '| **dec total** | **%d** | **%d** | **%+d** |\n' \
              "$DEC_BASE" "$DEC_HEAD" "$DEC_DELTA"
            echo ""
            echo "_Thresholds: text +${TEXT_MAX_INCREASE} B, data +${DATA_MAX_INCREASE} B, bss +${BSS_MAX_INCREASE} B._"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if [ "$TEXT_DELTA" -gt "$TEXT_MAX_INCREASE" ]; then
            echo "::error::text grew by ${TEXT_DELTA} B (threshold ${TEXT_MAX_INCREASE} B)"
            fail=1
          fi
          if [ "$DATA_DELTA" -gt "$DATA_MAX_INCREASE" ]; then
            echo "::error::data grew by ${DATA_DELTA} B (threshold ${DATA_MAX_INCREASE} B)"
            fail=1
          fi
          if [ "$BSS_DELTA" -gt "$BSS_MAX_INCREASE" ]; then
            echo "::error::bss grew by ${BSS_DELTA} B (threshold ${BSS_MAX_INCREASE} B)"
            fail=1
          fi
          exit "$fail"
