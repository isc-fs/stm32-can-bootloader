# Source of truth for ROADMAP.md.
#
# Edit this file (or close / reopen a tracking issue on GitHub) and the
# `roadmap.yml` workflow will regenerate ROADMAP.md with updated status
# badges and a fresh mermaid branch diagram. Do not hand-edit ROADMAP.md —
# the workflow will overwrite any local changes.
#
# Schema:
#   title:      H1 heading shown at the top of ROADMAP.md. Optional;
#               falls back to a generic "Project roadmap".
#   intro:      One-paragraph description shown under the heading.
#               Optional; falls back to a generic paragraph.
#   phases:     list of phase clusters. Each phase has a number, a title,
#               a tag applied on dev→main when every branch in the phase
#               has landed, and a list of planned feat/fix branches. Each
#               branch has a `name` (exact git branch name) and a short
#               `scope` sentence used as the commit label in the mermaid
#               diagram. Two optional phase-level fields:
#                 deferred: true  — mark the phase as paused. The table
#                                   shows `⏸ deferred` for every branch
#                                   in the phase (regardless of tracking
#                                   issue state) and appends `(deferred)`
#                                   to the phase title. The mermaid
#                                   diagram skips the phase entirely so
#                                   the branch flow reads cleanly through
#                                   the last active phase.
#                 note: "..."     — free-form one-liner rendered as a
#                                   sub-line under the phase title in the
#                                   roadmap table. Useful alongside
#                                   `deferred: true` to explain why.
#   sidequests: off-roadmap branches kept in the diagram for history
#               (e.g. workflow tooling that doesn't map to a bootloader
#               phase). Rendered in the table but not in the main diagram
#               lane.

title: Bootloader roadmap

intro: |
  Production roadmap for the STM32H733 CAN bootloader. Each phase is a
  cluster of feat/fix branches cut from `dev`; a milestone tag on `main`
  closes the phase once every branch in it has merged. Branch status
  badges (✅ / 🔄 / 🔜) are derived from each branch's tracking issue
  state in GitHub Issues.

  Phases 1–4 build the bootloader to **v1.0.0** — feature-complete for
  its intended use (internal tool, closed harness). v1.0.0 was the
  *start* of a reliability arc, not the finish: phases 5–10 are the
  six-release hardening run (v1.2.0 → v1.6.2) that turned it into a
  brick-safe field tool — host-test scaffold + audit hardening, node-ID
  provisioning, field-brick prevention, fault-operational recovery
  (IWDG + bus-off + fault-reboot), multi-bus FDCAN, and finally the
  500 kbps revert + ECC-brick recovery that closed the v1.6.0 brick
  crisis. The current release is **v1.6.2** (see
  [CHANGELOG.md](CHANGELOG.md)). Phase 11 (security) stays deferred
  behind the `⏸ deferred` badge — picked up if scope ever expands to a
  public or shared network.

phases:
  - number: 1
    title: Memory map & firmware contract
    tag: v0.1.1-memmap
    branches:
      - name: feat/1
        scope: bl_memmap.h + ARCHITECTURE.md

  - number: 2
    title: Protocol rewrite (classic CAN)
    tag: v0.2.0-protocol
    branches:
      - name: feat/5-frame-layout
        scope: 11-bit [type|src|dst] IDs + node ID + dispatch
      - name: feat/6-isotp
        scope: ISO-TP-style multi-frame segment / reassemble
      - name: feat/7-core-opcodes
        scope: CONNECT / DISCONNECT / DISCOVER / RESET / JUMP + NACK
      - name: feat/8-flash-opcodes
        scope: ERASE / WRITE / READ_CRC / VERIFY with sector-aware erase
      - name: feat/9-session-timeout
        scope: 30 s bootloader timeout + keepalive + retry budget

  - number: 3
    title: Firmware contract & diagnostics
    tag: v0.3.0-diagnostics
    branches:
      - name: feat/10-firmware-info
        scope: __firmware_info exposed on CONNECT / DISCOVER
      - name: feat/11-heartbeat-health
        scope: NOTIFY_HEARTBEAT + reset cause + WRP status + uptime
      - name: feat/12-dtc
        scope: DTC table + NOTIFY_DTC + DTC_READ / DTC_CLEAR
      - name: feat/13-log-stream
        scope: ring buffer + NOTIFY_LOG + LOG_STREAM_START / STOP
      - name: feat/14-live-data
        scope: LIVE_DATA_START / STOP (packed struct via signal set)

  - number: 4
    title: Config & option bytes
    tag: v0.4.0-config
    branches:
      - name: feat/15-nvm
        scope: NVM parameter store + NVM_READ / NVM_WRITE
      - name: feat/16-wrp-option-bytes
        scope: OB_READ + OB_APPLY_WRP + WRP self-check on boot

  - number: 5
    title: Reliability & observability hardening
    tag: v1.2.0
    branches:
      - name: feat/18-bl-proto-wire-tests
        scope: host Unity suite — wire-format build/parse coverage
      - name: feat/19-bl-proto-dispatch-scaffold
        scope: dispatcher test scaffold + FDCAN TX-capture mock
      - name: fix/audit-hardening-batch
        scope: audit-driven hardening (ISO-TP deadline, jump barriers, log ring)

  - number: 6
    title: Node-ID provisioning & CI gates
    tag: v1.3.1
    branches:
      - name: feat/26-nvm-node-id-override
        scope: NVM-backed node-id override — provision over CAN, no reflash
      - name: feat/23-host-coverage
        scope: host line-coverage gate with a ratcheting floor
      - name: feat/24-clang-tidy
        scope: changed-lines clang-tidy gate

  - number: 7
    title: Field-brick prevention
    tag: v1.4.0
    branches:
      - name: fix/audit-criticals-c2-c4
        scope: session-timeout-no-jump (C2) + WRP self-lock guard (C4)

  - number: 8
    title: Fault-operational hardening
    tag: v1.5.0
    branches:
      - name: feat/iwdg-enable
        scope: independent watchdog, sized to clear a 128 KB sector erase
      - name: feat/29-reset-on-spin
        scope: reboot-on-CPU-fault via a reset-surviving .noinit breadcrumb
      - name: feat/28-busoff-recovery-erase-probe
        scope: FDCAN bus-off auto-recovery + erase-duration probe

  - number: 9
    title: Multi-bus FDCAN & fleet cutover
    tag: v1.6.0
    branches:
      - name: feat/27-multi-fdcan-phase-a
        scope: serve FDCAN1/2/3 at once, reply on the origin bus
      - name: fix/154-auto-jump-alias
        scope: only an addressed frame cancels the boot auto-jump
      - name: fix/145-persist-stay-in-bl
        scope: stay-in-BL hold survives a power cycle (persisted in NVM)

  - number: 10
    title: 500 kbps & ECC-brick recovery
    tag: v1.6.2
    branches:
      - name: fix/166-ecc-brick
        scope: survive an interrupted flash write — reachable + reflashable
      - name: fix/174-clock-watchdog
        scope: FMEA hardening — IWDG-first, CSS, WRP-mask guard, bus-off un-wedge

  - number: 11
    title: Security
    tag: '—'
    deferred: true
    note: "paused — internal tool, physical-perimeter security is sufficient for current scope; reactivate if deployment model changes"
    branches:
      - name: feat/17-ed25519-sign
        scope: Ed25519 signature verification (__firmware_sig + pubkey)
      - name: feat/18-replay-counter
        scope: Monotonic counter with downgrade reject
      - name: feat/19-challenge-response
        scope: Session auth (CMD_CHALLENGE / CMD_CHALLENGE_RESP)
      - name: feat/20-encrypted-transport
        scope: Optional AES-128-CTR (BL_FEATURE_ENCRYPTED_TRANSPORT)

sidequests:
  - title: Workflow polish
    note: Not part of the bootloader roadmap. Kept here for branch history.
    branches:
      - feat/2-autoclose-on-dev-merge
      - fix/1-workflow-titled-branches
      - feat/3-roadmap
      - feat/4-roadmap-header-config
